<script type="application/json" id="pg-examples">{"python":[{"label":"Your First Python Program #1","code":"print(\"Hello, world!\")","output":"Hello, world!"},{"label":"Your First Python Program #2","code":"print(\"Learning\", \"Python\", \"is\", \"fun\")\nprint(\"2 + 3 =\", 2 + 3)\nprint()  # an empty print gives a blank line\nprint(\"Done!\")","output":"Learning Python is fun\n2 + 3 = 5\n\nDone!"},{"label":"Variables and Data Types #1","code":"city = \"Pune\"\npopulation = 7_400_000\narea_km2 = 331.3\nis_capital = False\n\nprint(city, population, area_km2, is_capital)","output":"Pune 7400000 331.3 False"},{"label":"Variables and Data Types #2","code":"print(type(\"hello\"))\nprint(type(42))\nprint(type(3.14))\nprint(type(True))","output":"\u003cclass 'str'>\n\u003cclass 'int'>\n\u003cclass 'float'>\n\u003cclass 'bool'>"},{"label":"Variables and Data Types #3","code":"score = 10\nscore = score + 5\nprint(\"Score:\", score)\n\nage_text = \"21\"\nage = int(age_text)\nprint(age + 1)\n\nprice = 49.99\nprint(\"Price is \" + str(price) + \" rupees\")","output":"Score: 15\n22\nPrice is 49.99 rupees"},{"label":"Variables and Data Types #4","code":"name = \"Meera\"\nmarks = 87.456\nprint(f\"{name} scored {marks:.1f} marks\")","output":"Meera scored 87.5 marks"},{"label":"Making Decisions with if #1","code":"temperature = 34\n\nif temperature > 30:\n    print(\"It is hot today.\")\n    print(\"Drink plenty of water.\")\n\nprint(\"Have a nice day!\")","output":"It is hot today.\nDrink plenty of water.\nHave a nice day!"},{"label":"Making Decisions with if #2","code":"marks = 72\n\nif marks >= 90:\n    grade = \"A\"\nelif marks >= 75:\n    grade = \"B\"\nelif marks >= 60:\n    grade = \"C\"\nelse:\n    grade = \"D\"\n\nprint(\"Grade:\", grade)","output":"Grade: C"},{"label":"Making Decisions with if #3","code":"age = 19\nhas_ticket = True\n\nif age >= 18 and has_ticket:\n    print(\"You may enter.\")\n\nif not has_ticket or age \u003c 18:\n    print(\"Sorry, no entry.\")\nelse:\n    print(\"Enjoy the show!\")","output":"You may enter.\nEnjoy the show!"},{"label":"Repeating Code with Loops #1","code":"for i in range(5):\n    print(\"Round\", i)","output":"Round 0\nRound 1\nRound 2\nRound 3\nRound 4"},{"label":"Repeating Code with Loops #2","code":"fruits = [\"mango\", \"banana\", \"guava\"]\nfor fruit in fruits:\n    print(fruit.upper())\n\nfor letter in \"abc\":\n    print(letter * 3)","output":"MANGO\nBANANA\nGUAVA\naaa\nbbb\nccc"},{"label":"Repeating Code with Loops #3","code":"balance = 1000\nyears = 0\nwhile balance \u003c 2000:\n    balance = balance * 1.1\n    years += 1\nprint(f\"It takes {years} years to double at 10% interest.\")","output":"It takes 8 years to double at 10% interest."},{"label":"Repeating Code with Loops #4","code":"for n in range(1, 10):\n    if n % 2 == 0:\n        continue   # skip even numbers\n    if n > 7:\n        break      # stop once we pass 7\n    print(n)","output":"1\n3\n5\n7"},{"label":"Writing Your Own Functions #1","code":"def greet():\n    print(\"Welcome to CodeShala!\")\n\ngreet()\ngreet()","output":"Welcome to CodeShala!\nWelcome to CodeShala!"},{"label":"Writing Your Own Functions #2","code":"def area_of_rectangle(width, height):\n    return width * height\n\nroom = area_of_rectangle(4, 3)\nprint(\"Room area:\", room)\nprint(\"Table area:\", area_of_rectangle(1.5, 0.8))","output":"Room area: 12\nTable area: 1.2000000000000002"},{"label":"Writing Your Own Functions #3","code":"def make_tea(cups, sugar=1, milk=True):\n    kind = \"milk tea\" if milk else \"black tea\"\n    return f\"{cups} cup(s) of {kind} with {sugar} spoon(s) of sugar\"\n\nprint(make_tea(2))\nprint(make_tea(1, sugar=0, milk=False))","output":"2 cup(s) of milk tea with 1 spoon(s) of sugar\n1 cup(s) of black tea with 0 spoon(s) of sugar"}],"c":[{"label":"Your First C Program #1","code":"#include \u003cstdio.h>\n\nint main(void) {\n    printf(\"Hello, world!\\n\");\n    return 0;\n}","output":"Hello, world!"},{"label":"Your First C Program #2","code":"#include \u003cstdio.h>\n\nint main(void) {\n    printf(\"%d + %d = %d\\n\", 7, 5, 7 + 5);\n    printf(\"Half of 9 is %.1f\\n\", 9 / 2.0);\n    return 0;\n}","output":"7 + 5 = 12\nHalf of 9 is 4.5"},{"label":"Variables and Data Types #1","code":"#include \u003cstdio.h>\n\nint main(void) {\n    int students = 42;\n    float height = 1.68f;\n    double pi = 3.14159265;\n    char grade = 'A';\n\n    printf(\"students = %d\\n\", students);\n    printf(\"height = %.2f m\\n\", height);\n    printf(\"pi = %.5f\\n\", pi);\n    printf(\"grade = %c\\n\", grade);\n    return 0;\n}","output":"students = 42\nheight = 1.68 m\npi = 3.14159\ngrade = A"},{"label":"Variables and Data Types #2","code":"#include \u003cstdio.h>\n\nint main(void) {\n    printf(\"int: %zu bytes\\n\", sizeof(int));\n    printf(\"double: %zu bytes\\n\", sizeof(double));\n    printf(\"char: %zu byte\\n\", sizeof(char));\n    return 0;\n}","output":"int: 4 bytes\ndouble: 8 bytes\nchar: 1 byte"},{"label":"Variables and Data Types #3","code":"#include \u003cstdio.h>\n\nint main(void) {\n    int a = 7, b = 2;\n    printf(\"%d / %d = %d\\n\", a, b, a / b);\n    printf(\"%d %% %d = %d\\n\", a, b, a % b);\n    printf(\"as double: %.1f\\n\", (double)a / b);\n    return 0;\n}","output":"7 / 2 = 3\n7 % 2 = 1\nas double: 3.5"},{"label":"Variables and Data Types #4","code":"#include \u003cstdio.h>\n\nint main(void) {\n    const int DAYS_IN_WEEK = 7;\n    int weeks = 3;\n    printf(\"%d weeks = %d days\\n\", weeks, weeks * DAYS_IN_WEEK);\n    return 0;\n}","output":"3 weeks = 21 days"},{"label":"Decisions with if and switch #1","code":"#include \u003cstdio.h>\n\nint main(void) {\n    int battery = 15;\n\n    if (battery \u003c 20) {\n        printf(\"Battery low: %d%%\\n\", battery);\n    } else {\n        printf(\"Battery fine.\\n\");\n    }\n    return 0;\n}","output":"Battery low: 15%"},{"label":"Decisions with if and switch #2","code":"#include \u003cstdio.h>\n\nint main(void) {\n    int hour = 14;\n\n    if (hour \u003c 12) {\n        printf(\"Good morning\\n\");\n    } else if (hour \u003c 17) {\n        printf(\"Good afternoon\\n\");\n    } else {\n        printf(\"Good evening\\n\");\n    }\n    return 0;\n}","output":"Good afternoon"},{"label":"Decisions with if and switch #3","code":"#include \u003cstdio.h>\n\nint main(void) {\n    int day = 3;\n\n    switch (day) {\n        case 1: printf(\"Monday\\n\"); break;\n        case 2: printf(\"Tuesday\\n\"); break;\n        case 3: printf(\"Wednesday\\n\"); break;\n        default: printf(\"Another day\\n\");\n    }\n    return 0;\n}","output":"Wednesday"},{"label":"Loops in C #1","code":"#include \u003cstdio.h>\n\nint main(void) {\n    for (int i = 1; i \u003c= 5; i++) {\n        printf(\"%d squared is %d\\n\", i, i * i);\n    }\n    return 0;\n}","output":"1 squared is 1\n2 squared is 4\n3 squared is 9\n4 squared is 16\n5 squared is 25"},{"label":"Loops in C #2","code":"#include \u003cstdio.h>\n\nint main(void) {\n    int n = 1234;\n    int digits = 0;\n    while (n > 0) {\n        n = n / 10;\n        digits++;\n    }\n    printf(\"1234 has %d digits\\n\", digits);\n    return 0;\n}","output":"1234 has 4 digits"},{"label":"Loops in C #3","code":"#include \u003cstdio.h>\n\nint main(void) {\n    int count = 0;\n    do {\n        printf(\"This runs once even though count is %d\\n\", count);\n    } while (count > 0);\n    return 0;\n}","output":"This runs once even though count is 0"},{"label":"Loops in C #4","code":"#include \u003cstdio.h>\n\nint main(void) {\n    int marks[] = {78, 92, 65, 88};\n    int total = 0;\n    for (int i = 0; i \u003c 4; i++) {\n        total += marks[i];\n    }\n    printf(\"Average: %.2f\\n\", total / 4.0);\n    return 0;\n}","output":"Average: 80.75"},{"label":"Functions in C #1","code":"#include \u003cstdio.h>\n\nint max_of(int a, int b) {\n    if (a > b) {\n        return a;\n    }\n    return b;\n}\n\nint main(void) {\n    printf(\"Larger: %d\\n\", max_of(8, 13));\n    printf(\"Larger: %d\\n\", max_of(-2, -9));\n    return 0;\n}","output":"Larger: 13\nLarger: -2"},{"label":"Functions in C #2","code":"#include \u003cstdio.h>\n\nvoid print_line(int length) {\n    for (int i = 0; i \u003c length; i++) {\n        printf(\"-\");\n    }\n    printf(\"\\n\");\n}\n\nint main(void) {\n    print_line(10);\n    printf(\"  Report\\n\");\n    print_line(10);\n    return 0;\n}","output":"----------\n  Report\n----------"},{"label":"Functions in C #3","code":"#include \u003cstdio.h>\n\ndouble celsius_to_fahrenheit(double c);   /* prototype */\n\nint main(void) {\n    printf(\"37 C = %.1f F\\n\", celsius_to_fahrenheit(37));\n    return 0;\n}\n\ndouble celsius_to_fahrenheit(double c) {\n    return c * 9 / 5 + 32;\n}","output":"37 C = 98.6 F"}],"java":[{"label":"Your First Java Program #1","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, world!\");\n    }\n}","output":"Hello, world!"},{"label":"Your First Java Program #2","code":"public class Main {\n    public static void main(String[] args) {\n        System.out.print(\"Java \");\n        System.out.print(\"is \");\n        System.out.println(\"everywhere.\");\n        System.out.println(\"Sum: \" + (10 + 20));\n    }\n}","output":"Java is everywhere.\nSum: 30"},{"label":"Variables and Data Types #1","code":"public class Main {\n    public static void main(String[] args) {\n        int age = 20;\n        double cgpa = 8.7;\n        char section = 'B';\n        boolean isEnrolled = true;\n        String name = \"Kabir\";\n\n        System.out.println(name + \" is \" + age + \" years old.\");\n        System.out.println(\"CGPA: \" + cgpa + \", section \" + section);\n        System.out.println(\"Enrolled? \" + isEnrolled);\n    }\n}","output":"Kabir is 20 years old.\nCGPA: 8.7, section B\nEnrolled? true"},{"label":"Variables and Data Types #2","code":"public class Main {\n    public static void main(String[] args) {\n        String word = \"Programming\";\n        System.out.println(word.length());\n        System.out.println(word.toUpperCase());\n        System.out.println(word.substring(0, 7));\n        System.out.println(word.contains(\"gram\"));\n    }\n}","output":"11\nPROGRAMMING\nProgram\ntrue"},{"label":"Variables and Data Types #3","code":"public class Main {\n    public static void main(String[] args) {\n        int items = 7;\n        double perPerson = items / 2.0;      // int widened to double\n        int rounded = (int) perPerson;        // cast drops the decimals\n        int fromText = Integer.parseInt(\"250\");\n\n        System.out.println(perPerson);\n        System.out.println(rounded);\n        System.out.println(fromText * 2);\n    }\n}","output":"3.5\n3\n500"},{"label":"Variables and Data Types #4","code":"public class Main {\n    public static void main(String[] args) {\n        var city = \"Jaipur\";          // compiler infers String\n        final double GST_RATE = 0.18;\n        double bill = 500 * (1 + GST_RATE);\n        System.out.println(city + \" bill: \" + bill);\n    }\n}","output":"Jaipur bill: 590.0"},{"label":"Conditions with if and switch #1","code":"public class Main {\n    public static void main(String[] args) {\n        int speed = 72;\n        int limit = 60;\n\n        if (speed > limit) {\n            System.out.println(\"Slow down! You are \" + (speed - limit) + \" km/h over.\");\n        } else {\n            System.out.println(\"Speed OK.\");\n        }\n    }\n}","output":"Slow down! You are 12 km/h over."},{"label":"Conditions with if and switch #2","code":"public class Main {\n    public static void main(String[] args) {\n        int year = 2024;\n        boolean leap = (year % 4 == 0 && year % 100 != 0) || year % 400 == 0;\n\n        if (leap) {\n            System.out.println(year + \" is a leap year\");\n        } else if (year % 2 == 0) {\n            System.out.println(year + \" is even but not a leap year\");\n        } else {\n            System.out.println(year + \" is an ordinary year\");\n        }\n    }\n}","output":"2024 is a leap year"},{"label":"Conditions with if and switch #3","code":"public class Main {\n    public static void main(String[] args) {\n        int stock = 0;\n        String label = stock > 0 ? \"In stock\" : \"Sold out\";\n        System.out.println(label);\n    }\n}","output":"Sold out"},{"label":"Conditions with if and switch #4","code":"public class Main {\n    public static void main(String[] args) {\n        String planet = \"Mars\";\n        int moons = switch (planet) {\n            case \"Earth\" -> 1;\n            case \"Mars\" -> 2;\n            case \"Venus\", \"Mercury\" -> 0;\n            default -> -1;\n        };\n        System.out.println(planet + \" has \" + moons + \" moons\");\n    }\n}","output":"Mars has 2 moons"},{"label":"Loops in Java #1","code":"public class Main {\n    public static void main(String[] args) {\n        for (int i = 1; i \u003c= 3; i++) {\n            System.out.println(\"7 x \" + i + \" = \" + (7 * i));\n        }\n    }\n}","output":"7 x 1 = 7\n7 x 2 = 14\n7 x 3 = 21"},{"label":"Loops in Java #2","code":"public class Main {\n    public static void main(String[] args) {\n        String[] languages = {\"Python\", \"C\", \"Java\", \"JavaScript\"};\n        for (String lang : languages) {\n            System.out.println(lang + \" has \" + lang.length() + \" letters\");\n        }\n    }\n}","output":"Python has 6 letters\nC has 1 letters\nJava has 4 letters\nJavaScript has 10 letters"},{"label":"Loops in Java #3","code":"public class Main {\n    public static void main(String[] args) {\n        int n = 27;\n        int steps = 0;\n        while (n != 1) {\n            n = (n % 2 == 0) ? n / 2 : 3 * n + 1;\n            steps++;\n        }\n        System.out.println(\"Reached 1 after \" + steps + \" steps\");\n\n        int tries = 0;\n        do {\n            tries++;\n        } while (tries \u003c 3);\n        System.out.println(\"tries = \" + tries);\n    }\n}","output":"Reached 1 after 111 steps\ntries = 3"},{"label":"Loops in Java #4","code":"public class Main {\n    public static void main(String[] args) {\n        int[] readings = {12, -1, 15, 999, 8};\n        int sum = 0;\n        for (int r : readings) {\n            if (r \u003c 0) continue;   // ignore bad readings\n            if (r == 999) break;   // 999 marks the end\n            sum += r;\n        }\n        System.out.println(\"Sum = \" + sum);\n    }\n}","output":"Sum = 27"},{"label":"Methods #1","code":"public class Main {\n    static int square(int x) {\n        return x * x;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(square(9));\n        System.out.println(square(square(2)));\n    }\n}","output":"81\n16"},{"label":"Methods #2","code":"public class Main {\n    static double simpleInterest(double principal, double ratePercent, int years) {\n        return principal * ratePercent * years / 100;\n    }\n\n    static void printReceipt(String item, double amount) {\n        System.out.printf(\"%-10s Rs %8.2f%n\", item, amount);\n    }\n\n    public static void main(String[] args) {\n        double interest = simpleInterest(20000, 7.5, 3);\n        printReceipt(\"Principal\", 20000);\n        printReceipt(\"Interest\", interest);\n        printReceipt(\"Total\", 20000 + interest);\n    }\n}","output":"Principal  Rs 20000.00\nInterest   Rs  4500.00\nTotal      Rs 24500.00"},{"label":"Methods #3","code":"public class Main {\n    static int add(int a, int b) {\n        return a + b;\n    }\n\n    static double add(double a, double b) {\n        return a + b;\n    }\n\n    static int add(int a, int b, int c) {\n        return a + b + c;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(add(2, 3));\n        System.out.println(add(2.5, 0.25));\n        System.out.println(add(1, 2, 3));\n    }\n}","output":"5\n2.75\n6"}],"javascript":[{"label":"Your First JavaScript Program #1","code":"console.log(\"Hello, world!\");","output":"Hello, world!"},{"label":"Your First JavaScript Program #2","code":"console.log(\"Minutes in a day:\", 24 * 60);\nconsole.log(\"Is 10 greater than 3?\", 10 > 3);\n// This is a comment. JavaScript ignores it.\nconsole.log(\"Done\");","output":"Minutes in a day: 1440\nIs 10 greater than 3? true\nDone"},{"label":"Variables and Data Types #1","code":"const course = \"JavaScript Basics\";\nlet lessonsDone = 1;\nlessonsDone = lessonsDone + 1;\n\nconsole.log(course, \"-\", lessonsDone, \"lessons done\");","output":"JavaScript Basics - 2 lessons done"},{"label":"Variables and Data Types #2","code":"console.log(typeof \"text\");\nconsole.log(typeof 42, typeof 3.5);\nconsole.log(typeof true);\nconsole.log(typeof undefined);\nconsole.log(typeof { name: \"Asha\" });\nconsole.log(typeof [1, 2, 3]);","output":"string\nnumber number\nboolean\nundefined\nobject\nobject"},{"label":"Variables and Data Types #3","code":"const item = \"notebook\";\nconst price = 45;\nconst qty = 3;\nconsole.log(`${qty} x ${item} = Rs ${price * qty}`);","output":"3 x notebook = Rs 135"},{"label":"Variables and Data Types #4","code":"const scores = [72, 88, 95];\nconst student = { name: \"Asha\", year: 2, scores };\n\nconsole.log(scores.length, scores[0]);\nconsole.log(student.name);\nconsole.log(student);","output":"3 72\nAsha\n{ name: 'Asha', year: 2, scores: [ 72, 88, 95 ] }"},{"label":"Conditions with if #1","code":"const hour = 21;\n\nif (hour \u003c 12) {\n  console.log(\"Good morning\");\n} else if (hour \u003c 18) {\n  console.log(\"Good afternoon\");\n} else {\n  console.log(\"Good evening\");\n}","output":"Good evening"},{"label":"Conditions with if #2","code":"console.log(5 == \"5\");\nconsole.log(5 === \"5\");\nconsole.log(0 == false);\nconsole.log(0 === false);","output":"true\nfalse\ntrue\nfalse"},{"label":"Conditions with if #3","code":"const username = \"\";\n\nif (username) {\n  console.log(`Welcome back, ${username}!`);\n} else {\n  console.log(\"Please log in.\");\n}","output":"Please log in."},{"label":"Conditions with if #4","code":"const age = 16;\nconst withParent = true;\n\nconst canWatch = age >= 18 || withParent;\nconsole.log(canWatch ? \"Enjoy the movie\" : \"Sorry, adults only\");\nconsole.log(!canWatch);","output":"Enjoy the movie\nfalse"},{"label":"Loops #1","code":"for (let i = 1; i \u003c= 5; i++) {\n  console.log(\"*\".repeat(i));\n}","output":"*\n**\n***\n****\n*****"},{"label":"Loops #2","code":"const cities = [\"Delhi\", \"Chennai\", \"Kolkata\"];\nfor (const city of cities) {\n  console.log(`${city} has ${city.length} letters`);\n}","output":"Delhi has 5 letters\nChennai has 7 letters\nKolkata has 7 letters"},{"label":"Loops #3","code":"let guess = 1;\nlet attempts = 0;\nwhile (guess * guess \u003c 200) {\n  guess++;\n  attempts++;\n}\nconsole.log(`${guess} is the first number whose square is at least 200`);\nconsole.log(\"Attempts:\", attempts);","output":"15 is the first number whose square is at least 200\nAttempts: 14"},{"label":"Loops #4","code":"const prices = [120, 45, 300, 80];\n\nconst withTax = prices.map((p) => p * 1.05);\nconst cheap = prices.filter((p) => p \u003c 100);\nconst total = prices.reduce((sum, p) => sum + p, 0);\n\nconsole.log(withTax);\nconsole.log(cheap);\nconsole.log(\"Total:\", total);","output":"[ 126, 47.25, 315, 84 ]\n[ 45, 80 ]\nTotal: 545"},{"label":"Functions #1","code":"function bmi(weightKg, heightM) {\n  return weightKg / (heightM * heightM);\n}\n\nconst value = bmi(68, 1.75);\nconsole.log(\"BMI:\", value.toFixed(1));","output":"BMI: 22.2"},{"label":"Functions #2","code":"const double = (n) => n * 2;\nconst greet = (name) => `Hi, ${name}!`;\n\nconsole.log(double(21));\nconsole.log(greet(\"Dev\"));","output":"42\nHi, Dev!"},{"label":"Functions #3","code":"function makeTag(text, tag = \"p\") {\n  return `\u003c${tag}>${text}\u003c/${tag}>`;\n}\n\nconsole.log(makeTag(\"Hello\"));\nconsole.log(makeTag(\"Title\", \"h1\"));","output":"\u003cp>Hello\u003c/p>\n\u003ch1>Title\u003c/h1>"},{"label":"Functions #4","code":"function repeat(times, action) {\n  for (let i = 1; i \u003c= times; i++) {\n    action(i);\n  }\n}\n\nrepeat(3, (n) => console.log(`Step ${n}`));","output":"Step 1\nStep 2\nStep 3"},{"label":"Functions #5","code":"console.log(\"Start\");\nsetTimeout(() => console.log(\"Half a second later\"), 500);\nconsole.log(\"End\");","output":"Start\nEnd\nHalf a second later"}]}</script>
